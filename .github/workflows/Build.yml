name: Build
on:
    workflow_call:
        secrets:
            githubAccessToken:
                required: true
        inputs:
            pipelineType:
                description: Pipeline Type
                default: build
                type: string
                required: false


env:
    uniqueWorkspaceId: ${{ vars.ZOS_SANDBOX_DIR }}/pipeline/${{ github.repository }}/${{ github.ref_name }}/build_b${{ github.run_number }} # adding a b before the number
    # to avoid an error caused by repeated build numbers
    buildIdentifier: build_b${{ github.run_number }}
    branch: ${{ github.ref_name }}
    application: ${{ github.event.repository.name }}
    pipelineType: ${{ inputs.pipelineType }}
    packageName: ${{ github.run_id }}
    zosHost: ${{ vars.ZOS_HOST }}
jobs:
    Setup:
        runs-on: self-hosted
        steps:
         - name: CI-CD pipeline parameter printout
           run: |
            echo " "
            echo "Following are the CI-CD pipeline parameters"
            echo "*******************************************"
            echo "uniqueWorkspaceId                  = ${{ env.uniqueWorkspaceId}}"
            echo "buildIdentifier                    = ${{ env.buildIdentifier}}"
            echo "branch                             = ${{ env.branch}}"
            echo "application                        = ${{ env.application}}"
            echo "pipelineType                       = ${{ env.pipelineType}}"
            echo "packageName                        = ${{ env.packageName}}"
            echo "zosHost                            = ${{ env.zosHost}}"
            
         - name: Clone Repo to z/OS Unix System Services
           run: ssh ${{ env.zosHost }} ". ./.profile && gitClone.sh -w ${{ env.uniqueWorkspaceId }} -r https://${{ secrets.githubAccessToken }}@github.com/${{ github.repository }}.git -b ${{ env.branch }}"

    Build:
        needs: Setup
        runs-on: self-hosted
        steps:
          - name: Build git repo
            run: ssh ${{ env.zosHost }} ". ./.profile && zBuilder.sh -w ${{ env.uniqueWorkspaceId }} -a ${{env.application}} -b ${{ env.branch }} -p ${{env.pipelineType}} -t 'full'"
          
          - name: Prepare logs
            if: ${{ always() }}
            run: | 
                ssh ${{ env.zosHost }} ". ./.profile && prepareLogs.sh -w ${{ env.uniqueWorkspaceId }}"
                rm -rf "${{ runner.temp }}/build-logs"
                mkdir "${{ runner.temp }}/build-logs"
                sftp ${{ env.zosHost }}:${{ env.uniqueWorkspaceId }}/*.tar "\"${{ runner.temp }}/build-logs\""
                tar -xvf "${{ runner.temp }}/build-logs/logs.tar" -C "${{ runner.temp }}/build-logs"

          - name: Upload build logs
            uses: actions/upload-artifact@v4
            with:
                name: build_logs_${{github.run_number }}                        # Name used for artifact when it is uploaded
                path: ${{ runner.temp }}/build-logs                             # Path to build logs artifacts
                retention-days: 1
      
    Deploy-Integration:
        needs: Build
        runs-on: self-hosted
        steps:

          - name: Generate deployment plan 
            run: ssh ${{ env.zosHost }} ". ./.profile && mkdir -p ${{ env.uniqueWorkspaceId }}/deployPkgDir/deploy-logs && wazideploy-generate.sh -w ${{ env.uniqueWorkspaceId }} -a ${{ env.application }} -i ${{ env.uniqueWorkspaceId }}/${env.application}/logs/some.tar -b ${{ env.branch }}"
            
          - name: Deploy to integration
            run: ssh ${{ env.zosHost }} ". ./.profile && wazideploy-deploy.sh -w ${{ env.uniqueWorkspaceId }} -e Development.yaml -l deploy-logs/evidences/evidence.yaml"
          
          - name: Generate and publish deployment report for integration
            run: | 
                ssh ${{ env.zosHost }} ". ./.profile && wazideploy-evidence.sh -w ${{ env.uniqueWorkspaceId }} -l deploy-logs/evidence.yaml -o deploy-logs/deployment-report.html"
                rm -rf "${{ runner.temp }}/deploy-logs"
                mkdir "${{ runner.temp }}/deploy-logs"
                sftp -r ${{ env.zosHost }}:${{ env.uniqueWorkspaceId }}/deployPkgDir/deploy-logs/* "\"${{ runner.temp }}/deploy-logs\""
          
          - name: Upload deploy logs
            uses: actions/upload-artifact@v4
            with:
              name: deploy_logs_${{github.run_number }}                    # Name used for artifact when it is uploaded
              path: ${{ runner.temp }}/deploy-logs                        # Path to build logs artifacts
              retention-days: 1

    Cleanup:
        needs:
            - Deploy-Integration
        runs-on: self-hosted
        if: always()
        steps:
            - name: Cleanup Build Environment
              run: ssh ${{ env.zosHost }} ". ./.profile && deleteWorkspace.sh -w ${{ env.uniqueWorkspaceId }}"
            
