name: Feature
on:
    workflow_call:
        secrets:
            githubAccessToken:
                required: true
        inputs:
            pipelineType:
                description: Pipeline Type
                default: build
                type: string
                required: false


env:
    uniqueWorkspaceId: ${{ vars.ZOS_SANDBOX_DIR }}/pipeline/${{ github.repository }}/${{ github.ref_name }}/build_f${{ github.run_number }} # adding an f before the number
    # to avoid an error caused by repeated build numbers
    buildIdentifier: build_f${{ github.run_number }}
    pipelineType: ${{ inputs.pipelineType }}
    branch: ${{ github.ref_name }}
    application: ${{ github.event.repository.name }}
    packageName: ${{ github.run_id }}
    zosHost: ${{ vars.ZOS_HOST }}

jobs:
    Setup:
        runs-on: self-hosted
        steps:
         - name: CI-CD pipeline parameter printout
           run: |
            echo " "
            echo "Following are the CI-CD pipeline parameters"
            echo "*******************************************"
            echo "uniqueWorkspaceId                  = ${{ env.uniqueWorkspaceId}}"
            echo "buildIdentifier                    = ${{ env.buildIdentifier}}"
            echo "branch                             = ${{ env.branch}}"
            echo "application                        = ${{ env.application}}"
            echo "pipelineType                       = ${{ env.pipelineType}}"
            echo "packageName                        = ${{ env.packageName}}"
            echo "zosHost                            = ${{ env.zosHost}}"
            
         - name: Clone Repo to z/OS Unix System Services
           run: ssh ${{ env.zosHost }} ". ./.profile && gitClone.sh -w ${{ env.uniqueWorkspaceId }} -r https://${{ secrets.githubAccessToken }}@github.com/${{ github.repository }}.git -b ${{ env.branch }}"

    Build:
        needs:
         - Setup
        runs-on: self-hosted
        permissions:
            contents: read
            actions: read          # required by code-coverage-report-action to store/download coverage artifacts
            checks: write          # required by action-junit-report to create the check run
            pull-requests: read    # required by upload-code-coverage (resolves PR context via gh CLI)
            code-quality: write    # required by upload-code-coverage to upload coverage data
        steps:
          - name: scan-code-task
            run: |
                ssh ${{ env.zosHost }} ". ./.profile && cd ${{ env.uniqueWorkspaceId }}/${{ env.application }} && bash .setup/pipeline-common.sh scan && mkdir -p ${{ env.uniqueWorkspaceId }}/logs && cp -R ${{ env.uniqueWorkspaceId }}/${{ env.application }}/logs/zcodescan/. ${{ env.uniqueWorkspaceId }}/logs"

          - name: execute-build-task
            run: |
                ssh ${{ env.zosHost }} << 'EOF'
                  . ./.profile
                  cd ${{ env.uniqueWorkspaceId }}/${{ env.application }}
                  bash .setup/pipeline-common.sh build
                  mkdir -p ${{ env.uniqueWorkspaceId }}/logs
                  cp -R ${{ env.uniqueWorkspaceId }}/${{ env.application }}/logs/. ${{ env.uniqueWorkspaceId }}/logs
                  mkdir ${{ env.uniqueWorkspaceId }}/logs/cc
                  cp -R /var/debug/code_coverage_collector_output/IBMUSER/*CCC*/. ${{ env.uniqueWorkspaceId }}/logs/cc
                  chtag -tc UTF-8 ${{ env.uniqueWorkspaceId }}/logs/cc/*.xml
                EOF

          - name: prepare-logs
            if: ${{ always() }}
            run: |
                ssh ${{ env.zosHost }} ". ./.profile && prepareLogs.sh -w ${{ env.uniqueWorkspaceId }}"
                rm -rf "${{ runner.temp }}/build-logs"
                mkdir "${{ runner.temp }}/build-logs"
                sftp ${{ env.zosHost }}:${{ env.uniqueWorkspaceId }}/*.tar "${{ runner.temp }}/build-logs"
                tar -xvf "${{ runner.temp }}/build-logs/logs.tar" -C "${{ runner.temp }}/build-logs"
                # the unit test runner writes classname="<PROGRAM>.unknown"; drop the ".unknown" suffix for the test report
                find "${{ runner.temp }}/build-logs" -name '*.eqatstr_junit.xml' -exec sed -i 's/\(classname="[^"]*\)\.unknown"/\1"/g' {} +
        
          - name: publish-test-results
            if: ${{ always() }}
            uses: mikepenz/action-junit-report@v6
            with:
                report_paths: ${{ runner.temp }}/build-logs/**/*.eqatstr_junit.xml       # JUnit XML files from the unit test / scan tasks
                check_name: Build Test Results
                detailed_summary: true                                     # Render per-test results on the job summary page
                include_passed: true
                require_tests: false                                       # Do not fail if no JUnit files were produced
                fail_on_failure: false                                     # Build task already determines pipeline status

          - name: checkout-ci-scripts
            if: ${{ always() }}
            uses: actions/checkout@v6
            with:
                sparse-checkout: .github/scripts
                sparse-checkout-cone-mode: true

          - name: publish-zcodescan-summary
            if: ${{ always() }}
            run: |
                report=$(find "${{ runner.temp }}/build-logs" -name 'zcs_export_sonarqube.json' | head -n 1)
                if [ -z "$report" ]; then echo "No ZCodeScan SonarQube report found"; exit 0; fi
                python3 .github/scripts/zcodescan-summary.py "$report" --repo "${{ github.repository }}" --sha "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

          - name: locate-coverage-report
            id: coverage
            run: |
                command -v gh >/dev/null || { echo "gh CLI is not installed on this runner"; exit 1; }
                # the Cobertura file is copied from z/OS into build-logs/cc by the build task
                report=$(find "${{ runner.temp }}/build-logs" -name '*CCCOBERTURA.xml' | head -n 1)
                if [ -z "$report" ]; then echo "No Cobertura report found"; exit 1; fi
                # code-coverage-report-action requires the file to be inside $GITHUB_WORKSPACE
                mkdir -p "$GITHUB_WORKSPACE/coverage"
                rm -f "$GITHUB_WORKSPACE"/coverage/*.xml
                cp "$report" "$GITHUB_WORKSPACE/coverage/cobertura.xml"
                echo "file=coverage/cobertura.xml" >> "$GITHUB_OUTPUT"
          
          #- name: upload-code-coverage
          #  uses: actions/upload-code-coverage@v1
          #  with:
          #      file: ${{ steps.coverage.outputs.file }}
          #      language: Java
          #      label: code-coverage/jacoco
          #      fail-on-error: false
          
          - name: code-coverage-summary-report
            uses: clearlyip/code-coverage-report-action@v7.0     # node24; replaces 5monkeys/cobertura-action (node20, unmaintained)
            with:
                 filename: ${{ steps.coverage.outputs.file }}
                 overall_coverage_fail_threshold: 0
                 file_coverage_error_min: 25
                 file_coverage_warning_max: 50

          - name: upload-build-logs
            if: ${{ always() }}
            uses: actions/upload-artifact@v7
            with:
                name: build_${{github.run_number }}                        # Name used for artifact when it is uploaded
                path: ${{ runner.temp }}/build-logs                        # Path to build logs artifacts
                retention-days: 1

    Deploy:
        needs: Build
        runs-on: self-hosted
        steps:

          - name: deploy-dev
            run: |
                ssh ${{ env.zosHost }} ". ./.profile && cd ${{ env.uniqueWorkspaceId }}/${{ env.application }} && bash .setup/pipeline-common.sh deploy && mkdir -p ${{ env.uniqueWorkspaceId }}/logs && rm -Rf ${{ env.uniqueWorkspaceId }}/logs/*.*  && cp /usr/local/sandboxes/bank-of-z/logs/deploy/*.* ${{ env.uniqueWorkspaceId }}/logs"
                ssh ${{ env.zosHost }} ". ./.profile && mkdir -p /usr/local/sandboxes/bank-of-z/wd_analysis/${{ github.run_number }} && cp /usr/local/sandboxes/bank-of-z/logs/deploy/evidences/*.yaml /usr/local/sandboxes/bank-of-z/wd_analysis/${{ github.run_number }}"

          - name: prepare-logs
            if: ${{ always() }}
            run: |
                ssh ${{ env.zosHost }} ". ./.profile && prepareLogs.sh -w ${{ env.uniqueWorkspaceId }}"
                rm -rf "${{ runner.temp }}/build-logs"
                mkdir "${{ runner.temp }}/build-logs"
                sftp ${{ env.zosHost }}:${{ env.uniqueWorkspaceId }}/*.tar "${{ runner.temp }}/build-logs"
                tar -xvf "${{ runner.temp }}/build-logs/logs.tar" -C "${{ runner.temp }}/build-logs"
        
          - name: upload-build-logs
            if: ${{ always() }}
            uses: actions/upload-artifact@v7
            with:
                name: deploy_${{github.run_number }}                        # Name used for artifact when it is uploaded
                path: ${{ runner.temp }}/build-logs                         # Path to build logs artifacts
                retention-days: 1

    Cleanup:
        needs:
          - Build
          - Deploy
        runs-on: self-hosted
        if: always()
        steps:
          - name: cleanup-workspace
            run: ssh ${{ env.zosHost }} ". ./.profile && deleteWorkspace.sh -w ${{ env.uniqueWorkspaceId }}"
            
