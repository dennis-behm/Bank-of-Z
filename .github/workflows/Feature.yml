name: Feature
on:
    workflow_call:
        secrets:
            githubAccessToken:
                required: true
        inputs:
            pipelineType:
                description: Pipeline Type
                default: build
                type: string
                required: false

env:
    uniqueWorkspaceId: ${{ vars.ZOS_SANDBOX_DIR }}/pipeline/${{ github.repository }}/${{ github.ref_name }}/build_f${{ github.run_number }} # adding an f before the number
    # to avoid an error caused by repeated build numbers
    buildIdentifier: build_f${{ github.run_number }}
    pipelineType: ${{ inputs.pipelineType }}
    branch: ${{ github.ref_name }}
    application: ${{ github.event.repository.name }}
    packageName: ${{ github.run_id }}
    zosHost: ${{ vars.ZOS_HOST }}

jobs:
    Setup:
        runs-on: self-hosted
        steps:    
          - name: CI-CD pipeline parameter printout
            run: |
                echo " "
                echo "Following are the CI-CD pipeline parameters"
                echo "*******************************************"
                echo "uniqueWorkspaceId                  = ${{ env.uniqueWorkspaceId}}"
                echo "buildIdentifier                    = ${{ env.buildIdentifier}}"
                echo "pipelineType                       = ${{ env.pipelineType}}"
                echo "branch                             = ${{ env.branch}}"
                echo "application                        = ${{ env.application}}"
                echo "packageName                        = ${{ env.packageName}}"
                echo "zosHost                            = ${{ env.zosHost}}"

          - name: Clone Repo to z/OS Unix System Services
            run: ssh ${{ env.zosHost }} ". ./.profile && gitClone.sh -w ${{ env.uniqueWorkspaceId }} -r https://${{ secrets.githubAccessToken }}@github.com/${{ github.repository }}.git -b ${{ env.branch }}"

    Build:
        needs:
         - Setup
        runs-on: self-hosted
        steps: 
          - name: Build git repo
            run: ssh ${{ env.zosHost }} ". ./.profile && cd ${{ env.uniqueWorkspaceId }}/${{ env.application }} && pwd && .setup/pipeline-remote.sh build"
          - name: Prepare logs
            if: ${{ always() }}
            run: |
                ssh ${{ env.zosHost }} ". ./.profile && prepareLogs.sh -w ${{ env.uniqueWorkspaceId }}"
                rm -rf "${{ runner.temp }}/build-logs"
                mkdir "${{ runner.temp }}/build-logs"
                sftp ${{ env.zosHost }}:${{ env.uniqueWorkspaceId }}/*.tar "\"${{ runner.temp }}/build-logs\""
                tar -xvf "${{ runner.temp }}/build-logs/logs.tar" -C "${{ runner.temp }}/build-logs"
        
          - name: Upload build logs
            if: ${{ always() }}
            uses: actions/upload-artifact@v4
            with:
                name: build_${{github.run_number }}                        # Name used for artifact when it is uploaded
                path: ${{ runner.temp }}/build-logs                        # Path to build logs artifacts
                retention-days: 1

    Cleanup:
        needs:
          - Build
        runs-on: self-hosted
        if: always()
        steps:
          - name: Cleanup Build Environment
            run: ssh ${{ env.zosHost }} ". ./.profile && deleeWorkspace.sh -w ${{ env.uniqueWorkspaceId }}"
