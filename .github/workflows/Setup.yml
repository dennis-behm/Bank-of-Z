name: Setup
on:
    workflow_call:
        secrets:
            githubAccessToken:
                required: true

env:
    uniqueWorkspaceId: ${{ vars.ZOS_SANDBOX_DIR }}/setup/${{ github.repository }}/${{ github.ref_name }}/setup_s${{ github.run_number }}
    branch: ${{ github.ref_name }}
    application: ${{ github.event.repository.name }}
    zosHost: ${{ vars.ZOS_HOST }}
    bozFrontendUrl: https://9.47.80.84:9081


jobs:
    Setup:
        runs-on: self-hosted
        steps:
          - name: CI-CD pipeline parameter printout
            run: |
                echo " "
                echo "Following are the CI-CD pipeline parameters"
                echo "*******************************************"
                echo "uniqueWorkspaceId                  = ${{ env.uniqueWorkspaceId}}"
                echo "branch                             = ${{ env.branch}}"
                echo "application                        = ${{ env.application}}"
                echo "zosHost                            = ${{ env.zosHost}}"

          - name: Clone Repo to z/OS Unix System Services
            run: ssh ${{ env.zosHost }} ". ./.profile && gitClone.sh -w ${{ env.uniqueWorkspaceId }} -r https://${{ secrets.githubAccessToken }}@github.com/${{ github.repository }}.git -b ${{ env.branch }}"

    Install:
        needs: Setup
        runs-on: self-hosted
        steps:
          - name: Run Bank of Z installation procedure
            run: |
              ssh ${{ env.zosHost }} "
                . ./.profile &&
                cd ${{ env.uniqueWorkspaceId }} &&
                if [ -d ${{ env.application }} ]; then cd ${{ env.application }}; fi &&
                bash .setup/setup-remote.sh
              "

    Install-Verfication:
         needs: Install
         runs-on: self-hosted
         steps:
          - name: Verify zOS Frontend availability
            run: |
              ADMIN_URL="${{ env.bozFrontendUrl }}/admin.html"
              HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "$ADMIN_URL" || true)
              [ "$HTTP_STATUS" = "200" ] && echo "OK: $ADMIN_URL returned HTTP 200" && exit 0
              echo "FAIL: $ADMIN_URL returned HTTP ${HTTP_STATUS:-000}" >&2
              exit 1

    Test-Customer-Details:
        needs: Install-Verfication
        runs-on: self-hosted
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Check Python installation
            run: |
              python3 --version
              echo "Python check passed"

          - name: Test - Get Customer Details (C0000001)
            run: bash tests/test_get_customer.sh

