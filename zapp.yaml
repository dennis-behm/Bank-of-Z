name: Generated ZAPP document
description: >-
  CRRZG5299I Note that this default file will search all your local folders in
  all your open VS Code workspaces and can be highly inefficient. Modify the
  "locations" entries to be as specific as possible. Add a new entry of type
  "MVS" to specify remote locations. See the user documentation for more
  details:
  https://ibm.github.io/zopeneditor-about/Docs/setting_propertygroup.html
author: IBM Z Open Editor

propertyGroups:
  - name: search-all
    libraries:
      - name: syslib
        type: local
        locations:
          - "**"

profiles:
  # TAZ
  - name: taz-test
    type: test
    settings:
      unitTest:
        procLib:
          - SYS1.PROCLIB # Required: Procedure libraries
        userLibraries:
          - BANKZ.V0R1M0.LOAD # Application load libraries

  # Custom ZCodeScan rules example
  - name: zcodescan
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
            - "zcodescan/zcodescan-rules.yaml"

  - name: zBuilder-userbuild
    type: dbb
    settings:
      command: "$DBB_HOME/bin/dbb build"
      lifecycle: user
      lifecycleArgs:
        - "--hlq ${dbbHlq}"
        - "--errPrefix ${errPrefix}" # Requires advanced capabilities
        - "--verbose"
      additionalDependencies:
        - "dbb-app.yaml"
        - "dbb-app_ub.yaml"
      logFilePatterns:
        - "*.log" # Fetch build logs
        - "*.json" # Fetch Runtime.json and BuildReport.json
        - "*.html" # Fetch BuildReport.html

  # User build v2 example 1: Regular Zowe-based DBB build
  - name: zowe-upload-userbuild2
    type: userbuild
    settings:
      tasks:
        - dependencies:
            additionalDependencies:
              - dbb-app.yaml
        - build:
            remoteCommandShell: >
              $DBB_HOME/bin/dbb build user --hlq ${dbbHlq} --errPrefix ${errPrefix} ${currentProgram}
        - results:
            logFilePatterns:
              - "${application}/logs/*.log"
              - "${application}/logs/*.json"
              - "${application}/logs/BuildReport.html"

  - name: git-based-userbuild
    type: userbuild
    settings:
      tasks:
        - upload:
            localCommand: >
              .zopeneditor/grub_client gitBundle --zoweProfile ${defaultZoweProfile}
              --remoteWorkspace ${dbbWorkspace} --verbose
        - custom:
            localCommand: >
              .vscode/createBuildList.sh BANKZ-main ${buildFile.basename} ${dbbWorkspace}
        - build:
            localCommand: >
              .zopeneditor/grub_client execute --zoweProfile ${defaultZoweProfile}
              --remoteWorkspace ${dbbWorkspace}/${application}
              --command "$DBB_HOME/bin/dbb build user --hlq ${dbbHlq}
              ${dbbWorkspace}/buildList.txt" --verbose
        - post:
            remoteCommand: >
             rm ${dbbWorkspace}/user-build-logs.tar && tar -cf ${dbbWorkspace}/user-build-logs.tar ${dbbWorkspace}/${application}/logs/*
            localCommand: >
             zowe rse download uss-file "${dbbWorkspace}/user-build-logs.tar" 
             tar -xf user-build-logs.tar
