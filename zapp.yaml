name: Bank of Z zapp document
description: >-
  See the user documentation for more details:
  https://ibm.github.io/zopeneditor-about/Docs/setting_propertygroup.html
author: Bank of Z Team
propertyGroups:
  - name: search-all-local
    libraries:
      - name: syslib
        type: local
        locations:
          - "src/base/cics/copy"
          - "src/base/ims/copy"
      - name: syslib
        type: mvs
        locations:
          #- ${DTE_COPYBOOK_DATASET}
          - EQAW.SEQASAMP
  - name: remote-libraries
    language: cobol
    compilerOptions: CICS
    libraries:
        - name: syslib
          type: mvs
          locations:
             - BANKZ.DBB.BMS.COPY    # default name when running bank-of-z setup
             - CICSTS63.CICS.SDFHCOB
             - EQAW.SEQASAMP

profiles:
  # TAZ
  - name: taz-test
    type: test
    settings:
      recording:
        applicationToCapture:
          recordingType: CICS
          programs:
            - INQCUST
          transactionId: "ODCS"
        hostRecordingSettings:
          dteEngineLocation: "EQAW.SEQAMOD"
          cicsRegion: CICSBOZ
          applicationDbrmLibrary: BANKZ.V0R1M0.DBRM
        sourceMaps:
          - source: src/base/cics/cobol/INQCUST.cbl
            module: INQCUST
      unitTest:
        procLib:
          - SYS1.PROCLIB # Required: Procedure libraries
        userLibraries:
          # - BANKZ.V0R1M0.LOAD # Application load libraries
          - IBMUSER.BOZ.UB.LOAD
          - BANKZ.V0R1M0.LOADLIB
          - BANKZ.V0R1M0.LOAD
          - BANKZ.V0R1M0.COPY
        defaultTestCaseFolder: ./tests/unit
          
  # Custom ZCodeScan rules example
  - name: zcodescan
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
            - "zcodescan/zcodescan-rules.yaml"

  - name: BankOfZFullBuild
    type: userbuild
    settings:
      tasks:
      - prerequisites:
          localCommand: >
            .zopeneditor/grub_client prerequisites --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE} --verbose
      - upload:
          dependenciesUpload: false
          localCommand: >
            .zopeneditor/grub_client gitPush --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE} --verbose
      - build:
          localCommand: >
            .zopeneditor/grub_client execute --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE}
            --command "bash ${ZOS_WORKSPACE}/${application}/.setup/setup-remote.sh"
            --verbose
      - results:
            localCommand: >
              .zopeneditor/grub_client fetch --hostname ${ZOS_USER}@${ZOS_HOST}
              --remoteWorkspace ${ZOS_WORKSPACE}
              --files "${application}/logs/*.console.log ${application}/logs/deploy/*.console.log"
              --localDir logs --verbose

  - name: BankOfZAppBuild
    type: userbuild
    settings:
      tasks:
      - prerequisites:
          localCommand: >
            .zopeneditor/grub_client prerequisites --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE} --verbose
      - upload:
          dependenciesUpload: false
          localCommand: >
            .zopeneditor/grub_client gitPush --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE} --verbose
      - build:
          localCommand: >
            .zopeneditor/grub_client execute --hostname ${ZOS_USER}@${ZOS_HOST}
            --remoteWorkspace ${ZOS_WORKSPACE}
            --command "bash ${ZOS_WORKSPACE}/${application}/.setup/pipeline-remote.sh"
            --verbose
      - results:
            localCommand: >
              .zopeneditor/grub_client fetch --hostname ${ZOS_USER}@${ZOS_HOST}
              --remoteWorkspace ${ZOS_WORKSPACE}
              --files "${application}/logs/*.log ${application}/logs/deploy/*.console.log"
              --localDir logs --verbose

  - name: BankOfZFileBuild
    type: userbuild
    settings:
      tasks:
      - upload:
          localCommand: >
            .zopeneditor/grub_client gitBundle --zoweProfile ${defaultZoweProfile}
            --remoteWorkspace ${ZOS_WORKSPACE} --verbose
      - build:
          localCommand: >
            .zopeneditor/grub_client execute --zoweProfile ${defaultZoweProfile}
            --remoteWorkspace ${ZOS_WORKSPACE}/${application}
            --command ". /u/ibmuser/.profile && $DBB_HOME/bin/dbb build user --hlq ${dbbHlq}
            --errPrefix ${errPrefix} --debug ${currentProgram}" --verbose
      - results:
          logFilePatterns:
            - "${application}/logs/*.log"
            - "${application}/logs/*.json"
            - "${application}/logs/BuildReport.html"
            - "${application}/logs/*/*.json"
            - "${application}/logs/*/*.bzumsg"
            - "${application}/logs/*/*.xml"            
