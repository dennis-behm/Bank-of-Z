rules:
  # ZCodeScan Rules
  - id: zcodescan.cobol.rules.ProgramIdRule
    severity: HIGH
  - id: zcodescan.cobol.rules.CallSyntaxRule
    severity: MEDIUM
  - id: zcodescan.cobol.rules.SqlWhereRule
    severity: MEDIUM
    statements:
      - name: "Select"
        value: true
      - name: "Delete"
        value: true
      - name: "Update"
        value: true
  - id: zcodescan.cobol.rules.RequireEndClauseRule
    severity: HIGH
    statements:
      - name: "If"
        value: true
      - name: "Evaluate"
        value: true
      - name: "Read"
        value: true
      - name: "Search"
        value: true
      - name: "Call"
        value: true
  - id: zcodescan.cobol.rules.GotoRule
    severity: MEDIUM
  - id: zcodescan.cobol.rules.GotoParagraphRule
    severity: MEDIUM

